# Komun reverse proxy (nginx) — starting point.
#
# Komun does not terminate TLS itself; run this behind a TLS listener (certbot / your proxy)
# Add the ssl_certificate lines and `listen 443 ssl;` for production.
#
# There is no relay and no WebSocket route to proxy — the server is plain HTTP + JSON.

server {
    listen 80;
    server_name komun.example.org;

    # API, avatars and post images all live on the Rust server (default :3000).
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /avatars/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    location /post-images/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    # SvelteKit static build (adapter-static) with an SPA fallback.
    location / {
        root /opt/komun/frontend;
        try_files $uri $uri/ /index.html;
    }
}
